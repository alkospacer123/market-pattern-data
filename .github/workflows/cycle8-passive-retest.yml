name: Cycle 8 Passive Retest

on:
  push:
    branches: [autonomous-search-v3]
    paths:
      - '.github/workflows/cycle8-passive-retest.yml'
  workflow_dispatch:

jobs:
  passive-retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout discovery data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Compile engines
        run: |
          python -m py_compile research/autonomous_search_v3.py
          python -m py_compile research/cycle7_equal_levels.py
          python -m py_compile research/cycle8_passive_retest.py
      - name: Run Cycle 8
        run: |
          python research/cycle8_passive_retest.py \
            --data-root . \
            --output results/cycle8-passive-retest
      - name: Save audit source
        if: always()
        run: |
          mkdir -p results/cycle8-passive-retest
          cp research/CYCLE8_PROTOCOL.md results/cycle8-passive-retest/protocol.md || true
          cp research/cycle8_passive_retest.py results/cycle8-passive-retest/cycle8_source.py || true
          cp research/cycle7_equal_levels.py results/cycle8-passive-retest/signal_source.py || true
          cp research/autonomous_search_v3.py results/cycle8-passive-retest/data_metrics_engine.py || true
      - name: Upload Cycle 8 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle8-passive-retest
          path: results/cycle8-passive-retest
          retention-days: 30
