name: Cycle 5 Causal Adaptive Selector

on:
  push:
    branches: [autonomous-search-v3]
    paths:
      - '.github/workflows/cycle5-adaptive-selector.yml'
  workflow_dispatch:

jobs:
  adaptive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout discovery data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Compile preregistered engines
        run: |
          python -m py_compile research/autonomous_search_v3.py
          python -m py_compile research/autonomous_search_v4_events.py
          python -m py_compile research/cycle5_adaptive_selector.py
      - name: Run Cycle 5 causal selector
        run: |
          python research/cycle5_adaptive_selector.py \
            --data-root . \
            --output results/cycle5-adaptive
      - name: Save audit source
        if: always()
        run: |
          mkdir -p results/cycle5-adaptive
          cp research/CYCLE5_PROTOCOL.md results/cycle5-adaptive/protocol.md || true
          cp research/cycle5_adaptive_selector.py results/cycle5-adaptive/selector_source.py || true
          cp research/autonomous_search_v4_events.py results/cycle5-adaptive/event_library_source.py || true
          cp research/autonomous_search_v3.py results/cycle5-adaptive/execution_engine.py || true
      - name: Upload Cycle 5 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle5-adaptive
          path: results/cycle5-adaptive
          retention-days: 30
