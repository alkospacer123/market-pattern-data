# Queue trigger only; Cycle 21 protocol and research semantics unchanged.
name: Cycle 21 Direct High-R Rule Mining

on:
  push:
    branches: [autonomous-search-v3]
    paths:
      - '.github/workflows/cycle21-direct-high-r-rules.yml'
  workflow_dispatch:

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        instrument: [CNYRUBF, USDRUBF]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install numpy pandas scikit-learn
      - name: Compile engines
        run: |
          python -m py_compile research/autonomous_search_v3.py
          python -m py_compile research/cycle16_sparse_block.py
          python -m py_compile research/cycle18_barrier_block.py
          python -m py_compile research/cycle21_direct_high_r_rules.py
      - name: Run direct high-R rule search
        run: |
          python research/cycle21_direct_high_r_rules.py \
            --data-root . \
            --instrument ${{ matrix.instrument }} \
            --output results/cycle21-${{ matrix.instrument }}
      - name: Save audit sources
        if: always()
        run: |
          mkdir -p results/cycle21-${{ matrix.instrument }}
          cp research/CYCLE21_PROTOCOL.md results/cycle21-${{ matrix.instrument }}/protocol.md || true
          cp research/cycle21_direct_high_r_rules.py results/cycle21-${{ matrix.instrument }}/engine.py || true
          cp research/cycle18_barrier_block.py results/cycle21-${{ matrix.instrument }}/execution_engine.py || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle21-${{ matrix.instrument }}
          path: results/cycle21-${{ matrix.instrument }}
          retention-days: 30