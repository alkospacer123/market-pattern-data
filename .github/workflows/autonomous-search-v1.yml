name: Autonomous Discovery v1

on:
  push:
    branches: [autonomous-search-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-search-v1
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout market data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Compile engine
        run: python -m py_compile research/autonomous_search_v1.py

      - name: Run full autonomous search
        run: |
          python research/autonomous_search_v1.py \
            --data-root . \
            --output results/autonomous-search-v1

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-search-v1
          path: results/autonomous-search-v1
          if-no-files-found: warn
          retention-days: 14
