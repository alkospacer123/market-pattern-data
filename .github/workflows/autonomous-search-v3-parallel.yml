name: Autonomous Discovery v3 Parallel

on:
  workflow_dispatch:

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - instrument: CNYRUBF
            timeframe: M1
          - instrument: CNYRUBF
            timeframe: M5
          - instrument: USDRUBF
            timeframe: M1
          - instrument: USDRUBF
            timeframe: M5
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout market data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Compile v3 engines
        run: |
          python -m py_compile research/autonomous_search_v3.py
          python -m py_compile research/autonomous_search_v3_context.py
      - name: Run context search
        run: |
          python research/autonomous_search_v3_context.py \
            --data-root . \
            --output results/autonomous-search-v3-${{ matrix.instrument }}-${{ matrix.timeframe }} \
            --instrument ${{ matrix.instrument }} \
            --timeframe ${{ matrix.timeframe }}
      - name: Save effective source
        if: always()
        run: |
          mkdir -p results/autonomous-search-v3-${{ matrix.instrument }}-${{ matrix.timeframe }}
          cp research/autonomous_search_v3.py results/autonomous-search-v3-${{ matrix.instrument }}-${{ matrix.timeframe }}/source_engine.py || true
          cp research/autonomous_search_v3_context.py results/autonomous-search-v3-${{ matrix.instrument }}-${{ matrix.timeframe }}/context_runner.py || true
      - name: Upload context artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-search-v3-${{ matrix.instrument }}-${{ matrix.timeframe }}
          path: results/autonomous-search-v3-${{ matrix.instrument }}-${{ matrix.timeframe }}
          retention-days: 14
