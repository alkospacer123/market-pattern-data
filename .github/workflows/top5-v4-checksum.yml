name: Top5 V4 raw data checksums
on:
  push:
    branches: [top5-v4-checksum-temp]
permissions:
  contents: read
jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raw SHA256 only
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            2026/CNY/CNY_2026_Q1_M1.csv \
            2026/CNY/CNY_2026_Q2_M1.csv \
            2026/Si/Si_2026_Q1_M1.csv \
            2026/Si/Si_2026_Q2_M1.csv
      - name: Package frozen M1 raw files
        uses: actions/upload-artifact@v4
        with:
          name: top5-v4-frozen-m1-data
          path: |
            2026/CNY/CNY_2026_Q1_M1.csv
            2026/CNY/CNY_2026_Q2_M1.csv
            2026/Si/Si_2026_Q1_M1.csv
            2026/Si/Si_2026_Q2_M1.csv
          if-no-files-found: error
          compression-level: 0
