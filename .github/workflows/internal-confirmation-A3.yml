name: Internal Confirmation A3-USDRUBF-M5-049

on:
  push:
    branches: [autonomous-search-v3]
    paths:
      - '.github/workflows/internal-confirmation-A3.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen candidate and market data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Compile frozen confirmation code
        run: |
          python -m py_compile research/autonomous_search_v3.py
          python -m py_compile research/internal_confirmation_A3_USDRUBF_M5_049.py
      - name: Run internal confirmation once
        run: python research/internal_confirmation_A3_USDRUBF_M5_049.py
      - name: Save audit inputs
        if: always()
        run: |
          mkdir -p results/internal-confirmation-A3-USDRUBF-M5-049
          cp research/frozen_candidate_A3-USDRUBF-M5-049.json results/internal-confirmation-A3-USDRUBF-M5-049/freeze_record.json || true
          cp research/internal_confirmation_A3_USDRUBF_M5_049.py results/internal-confirmation-A3-USDRUBF-M5-049/confirmation_source.py || true
          cp research/autonomous_search_v3.py results/internal-confirmation-A3-USDRUBF-M5-049/discovery_engine.py || true
      - name: Upload internal confirmation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-confirmation-A3-USDRUBF-M5-049
          path: results/internal-confirmation-A3-USDRUBF-M5-049
          retention-days: 30
