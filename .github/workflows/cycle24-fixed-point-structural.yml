name: Cycle 24 Fixed-Point Structural Stops

on:
  push:
    branches: [autonomous-search-v3]
    paths:
      - '.github/workflows/cycle24-fixed-point-structural.yml'
  workflow_dispatch:

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        instrument: [CNYRUBF, USDRUBF]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install numpy pandas scikit-learn
      - name: Compile engine
        run: |
          python -m py_compile research/autonomous_search_v3.py
          python -m py_compile research/cycle24_fixed_point_structural.py
      - name: Run fixed-point structural search
        run: |
          python research/cycle24_fixed_point_structural.py \
            --data-root . \
            --instrument ${{ matrix.instrument }} \
            --output results/cycle24-${{ matrix.instrument }}
      - name: Save audit sources
        if: always()
        run: |
          mkdir -p results/cycle24-${{ matrix.instrument }}
          cp research/CYCLE24_PROTOCOL.md results/cycle24-${{ matrix.instrument }}/protocol.md || true
          cp research/cycle24_fixed_point_structural.py results/cycle24-${{ matrix.instrument }}/engine.py || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle24-${{ matrix.instrument }}
          path: results/cycle24-${{ matrix.instrument }}
          retention-days: 30
