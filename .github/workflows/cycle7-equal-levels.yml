name: Cycle 7 Equal Levels

on:
  push:
    branches: [autonomous-search-v3]
    paths:
      - '.github/workflows/cycle7-equal-levels.yml'
  workflow_dispatch:

jobs:
  equal-levels:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout discovery data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Compile preregistered engine
        run: |
          python -m py_compile research/autonomous_search_v3.py
          python -m py_compile research/cycle7_equal_levels.py
      - name: Run Cycle 7
        run: |
          python research/cycle7_equal_levels.py \
            --data-root . \
            --output results/cycle7-equal-levels
      - name: Save audit source
        if: always()
        run: |
          mkdir -p results/cycle7-equal-levels
          cp research/CYCLE7_PROTOCOL.md results/cycle7-equal-levels/protocol.md || true
          cp research/cycle7_equal_levels.py results/cycle7-equal-levels/cycle7_source.py || true
          cp research/autonomous_search_v3.py results/cycle7-equal-levels/data_metrics_engine.py || true
      - name: Upload Cycle 7 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle7-equal-levels
          path: results/cycle7-equal-levels
          retention-days: 30
