name: Cycle 4 Event Discovery

on:
  push:
    branches: [autonomous-search-v3]
    paths:
      - '.github/workflows/cycle4-event-search.yml'
  workflow_dispatch:

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - instrument: CNYRUBF
            timeframe: M1
          - instrument: CNYRUBF
            timeframe: M5
          - instrument: USDRUBF
            timeframe: M1
          - instrument: USDRUBF
            timeframe: M5
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout discovery data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Compile event engine
        run: |
          python -m py_compile research/autonomous_search_v3.py
          python -m py_compile research/autonomous_search_v4_events.py
          python -m py_compile research/cycle4_event_search_fixed_runner.py
      - name: Run Cycle 4 event discovery
        run: |
          python research/cycle4_event_search_fixed_runner.py \
            --data-root . \
            --output results/cycle4-${{ matrix.instrument }}-${{ matrix.timeframe }} \
            --instrument ${{ matrix.instrument }} \
            --timeframe ${{ matrix.timeframe }}
      - name: Save audit source
        if: always()
        run: |
          mkdir -p results/cycle4-${{ matrix.instrument }}-${{ matrix.timeframe }}
          cp research/CYCLE4_PROTOCOL.md results/cycle4-${{ matrix.instrument }}-${{ matrix.timeframe }}/protocol.md || true
          cp research/autonomous_search_v4_events.py results/cycle4-${{ matrix.instrument }}-${{ matrix.timeframe }}/event_engine.py || true
          cp research/cycle4_event_search_fixed_runner.py results/cycle4-${{ matrix.instrument }}-${{ matrix.timeframe }}/fixed_runner.py || true
          cp research/autonomous_search_v3.py results/cycle4-${{ matrix.instrument }}-${{ matrix.timeframe }}/execution_engine.py || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle4-${{ matrix.instrument }}-${{ matrix.timeframe }}
          path: results/cycle4-${{ matrix.instrument }}-${{ matrix.timeframe }}
          retention-days: 30
