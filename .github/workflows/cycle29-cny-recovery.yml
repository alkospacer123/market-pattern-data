name: Cycle 29 CNY Recovery — Same Preregistered Experiment

on:
  push:
    branches: [autonomous-search-v3]
    paths:
      - '.github/workflows/cycle29-cny-recovery.yml'
  workflow_dispatch:

jobs:
  search-cny:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout research data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install numpy pandas scikit-learn
      - name: Compile exact Cycle 29 engines
        run: |
          python -m py_compile research/autonomous_search_v3.py
          python -m py_compile research/cycle24_fixed_point_structural.py
          python -m py_compile research/cycle27_fixed_stop_structural_event.py
          python -m py_compile research/cycle29_structure_aligned_passive.py
      - name: Run unchanged preregistered CNYRUBF Cycle 29 search
        run: |
          python research/cycle29_structure_aligned_passive.py \
            --data-root . \
            --instrument CNYRUBF \
            --output results/cycle29-CNYRUBF
      - name: Save audit sources
        if: always()
        run: |
          mkdir -p results/cycle29-CNYRUBF
          cp research/CYCLE29_PROTOCOL.md results/cycle29-CNYRUBF/protocol.md || true
          cp research/cycle29_structure_aligned_passive.py results/cycle29-CNYRUBF/engine.py || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle29-CNYRUBF-recovery
          path: results/cycle29-CNYRUBF
          retention-days: 30
