name: Autonomous Discovery v2

on:
  push:
    branches: [autonomous-search-v2]
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout market data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Build audited runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('research/autonomous_search_v2.py').read_text()
          bad='ctx=contexts[(c["instrument"],c["timeframe"]);'
          good='ctx=contexts[(c["instrument"],c["timeframe"])]'
          if bad not in src:
              raise SystemExit('expected one-line source typo not found')
          fixed=src.replace(bad,good,1)
          Path('/tmp/autonomous_search_v2_runtime.py').write_text(fixed)
          PY
          python -m py_compile /tmp/autonomous_search_v2_runtime.py
      - name: Run full nested M1 M5 search
        run: |
          python /tmp/autonomous_search_v2_runtime.py \
            --data-root . \
            --output results/autonomous-search-v2
      - name: Save effective runtime
        if: always()
        run: cp /tmp/autonomous_search_v2_runtime.py results/autonomous-search-v2/effective_runtime.py || true
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-search-v2
          path: results/autonomous-search-v2
          retention-days: 14
