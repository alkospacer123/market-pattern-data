name: Autonomous Discovery v2

on:
  push:
    branches: [autonomous-search-v2]
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout market data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Compile cached runner
        run: |
          python -m py_compile research/autonomous_search_v2_fast_runner.py
      - name: Run full nested M1 M5 search
        run: |
          python research/autonomous_search_v2_fast_runner.py \
            --data-root . \
            --output results/autonomous-search-v2
      - name: Save effective source
        if: always()
        run: |
          mkdir -p results/autonomous-search-v2
          cp research/autonomous_search_v2.py results/autonomous-search-v2/source_engine.py || true
          cp research/autonomous_search_v2_fast_runner.py results/autonomous-search-v2/fast_runner.py || true
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-search-v2
          path: results/autonomous-search-v2
          retention-days: 14
