name: Cycle 28 M1 Fixed-Stop Microstructure

on:
  push:
    branches: [autonomous-search-v3]
    paths:
      - '.github/workflows/cycle28-m1-fixed-stop-micro.yml'
  workflow_dispatch:

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        instrument: [CNYRUBF, USDRUBF]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout research data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install numpy pandas scikit-learn
      - name: Compile engines
        run: |
          python -m py_compile research/autonomous_search_v3.py
          python -m py_compile research/cycle24_fixed_point_structural.py
          python -m py_compile research/cycle28_m1_fixed_stop_micro.py
      - name: Run M1 fixed-stop microstructure search
        run: |
          python research/cycle28_m1_fixed_stop_micro.py \
            --data-root . \
            --instrument ${{ matrix.instrument }} \
            --output results/cycle28-${{ matrix.instrument }}
      - name: Save audit sources
        if: always()
        run: |
          mkdir -p results/cycle28-${{ matrix.instrument }}
          cp research/CYCLE28_PROTOCOL.md results/cycle28-${{ matrix.instrument }}/protocol.md || true
          cp research/cycle28_m1_fixed_stop_micro.py results/cycle28-${{ matrix.instrument }}/engine.py || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle28-${{ matrix.instrument }}
          path: results/cycle28-${{ matrix.instrument }}
          retention-days: 30
